<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GooberNet</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#121212;
            color:white;
        }

        header{
            background:#1f1f1f;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:2px solid #2d2d2d;
        }

        h1{
            color:#4ea3ff;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-left:20px;
            transition:.2s;
        }

        nav a:hover{
            color:#4ea3ff;
        }

        .hero{
            text-align:center;
            padding:100px 20px;
        }

        .hero h2{
            font-size:48px;
            margin-bottom:15px;
        }

        .hero p{
            font-size:20px;
            color:#cfcfcf;
            margin-bottom:30px;
        }

        button{
            background:#4ea3ff;
            color:white;
            border:none;
            padding:15px 35px;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
            transition:.2s;
        }

        button:hover{
            transform:scale(1.05);
        }

        .posts{
            max-width:800px;
            margin:auto;
            padding:40px 20px;
        }

        .post{
            background:#1e1e1e;
            padding:20px;
            border-radius:12px;
            margin-bottom:20px;
        }

        .username{
            color:#4ea3ff;
            font-weight:bold;
        }

        footer{
            text-align:center;
            padding:30px;
            color:#999;
            margin-top:40px;
        }
    </style>
</head>

<body>

<header>
    <h1>🪿 GooberNet</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">Explore</a>
        <a href="#">Profile</a>
        <a href="#">Login</a>
    </nav>
</header>


<section class="hero">
    <h2>Welcome to GooberNet</h2>
    <p>The internet's goofiest social network.</p>

    <button onclick="goober()">Become a Goober</button>
</section>


<section class="posts">

    <div class="post">
        <div class="username">@chatgpt</div>
        <br>
        <p>Welcome to GooberNet! 🎉</p>
    </div>

    <div class="post">
        <div class="username">@isaac</div>
        <br>
        <p>We're actually making a social media app 😭🙏</p>
    </div>

</section>


<footer>
    © 2026 GooberNet • Certified Goobers Only 🪿
</footer>


<script>
function goober(){
    alert("Welcome, certified goober. 😭🙏");
}
</script>
