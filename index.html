<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GooberNet 🪿</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #111;
    color: white;
}


/* HEADER */

header {
    background: #1d1d1d;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #4ea3ff;
    font-size: 28px;
}

nav a {
    color: white;
    margin-left: 20px;
    text-decoration: none;
}


/* HERO */

.hero {
    text-align: center;
    padding: 80px 20px;
}

.hero h1 {
    font-size: 50px;
}

.hero p {
    color: #aaa;
    font-size: 20px;
}


button {
    background: #4ea3ff;
    color: white;
    border: none;
    padding: 14px 30px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
}


/* SIGNUP */

.box {

    width: 350px;
    max-width: 90%;
    background: #1d1d1d;
    margin: auto;
    padding: 25px;
    border-radius: 15px;

}


input {

    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;

}



/* POSTS */

.posts {

    max-width: 800px;
    margin: 40px auto;
    padding: 20px;

}


.post {

    background:#1d1d1d;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;

}


.username {

    color:#4ea3ff;
    font-weight:bold;

}


footer {

    text-align:center;
    padding:40px;
    color:#777;

}


</style>

</head>


<body>



<header>

<div class="logo">
🪿 GooberNet
</div>


<nav>

<a href="#">Home</a>
<a href="#">Explore</a>
<a href="#">Profile</a>

</nav>


</header>





<section class="hero">

<h1>
Welcome to GooberNet
</h1>

<p>
The internet's goofiest social network 😭🙏
</p>

</section>





<div class="box">

<h2>
Create Account
</h2>


<input id="username" placeholder="Username">

<input id="email" placeholder="Email">


<input id="password"
type="password"
placeholder="Password">


<br><br>


<button onclick="signup()">
Sign Up
</button>


</div>







<section class="posts">


<div class="post">

<div class="username">
@chatgpt
</div>

<p>
Welcome to GooberNet 🎉
</p>

</div>



<div class="post">

<div class="username">
@isaac
</div>

<p>
We're building a social media app 😭🙏
</p>

</div>


</section>






<footer>

© 2026 GooberNet 🪿

</footer>







<!-- ONLY SUPABASE CODE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const url =
"https://lamnpsupqyhvhebkyrsy.supabase.co";


const key =
"sb_publishable_xKNmab4ME2quujm3rQcRcg_3NeKLJEp";


const client =
window.supabase.createClient(
    url,
    key
);



console.log("GooberNet connected to Supabase");





async function signup(){


let username =
document.getElementById("username").value;


let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



const result =
await client.auth.signUp({

email: email,

password: password

});



if(result.error){

alert(result.error.message);

return;

}



await client
.from("profiles")
.insert({

id: result.data.user.id,

username: username

});



alert(
"Welcome to GooberNet 🪿🔥"
);



}



</script>


</body>

</html>
