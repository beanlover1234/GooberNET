<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GooberNet 🪿</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #101010;
    color: white;
}


/* Header */

header {
    background: #1c1c1c;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #4ea3ff;
    font-size: 30px;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

nav a:hover {
    color: #4ea3ff;
}


/* Hero */

.hero {
    text-align: center;
    padding: 90px 20px;
}

.hero h1 {
    font-size: 55px;
}

.hero p {
    color: #bbb;
    font-size: 20px;
    margin: 20px;
}


/* Buttons */

button {

    background:#4ea3ff;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;

}

button:hover {
    transform:scale(1.05);
}


/* Signup */

.signup {

    background:#1c1c1c;
    max-width:400px;
    margin:auto;
    padding:30px;
    border-radius:15px;

}


input {

    width:100%;
    padding:12px;
    margin:10px 0;

    border:none;
    border-radius:8px;

}


/* Posts */

.posts {

    max-width:800px;
    margin:auto;
    padding:40px;

}


.post {

    background:#1c1c1c;
    padding:20px;
    margin-bottom:20px;
    border-radius:15px;

}


.username {

    color:#4ea3ff;
    font-weight:bold;

}


footer {

    text-align:center;
    padding:40px;
    color:#777;

}

</style>

</head>



<body>


<header>

<div class="logo">
🪿 GooberNet
</div>


<nav>

<a href="#">Home</a>
<a href="#">Explore</a>
<a href="#">Profile</a>

</nav>

</header>




<section class="hero">

<h1>
Welcome to GooberNet
</h1>

<p>
The internet's goofiest social network 😭🙏
</p>

<button onclick="goober()">
Become a Goober
</button>

</section>





<section class="signup">

<h2>
Create Account
</h2>


<input id="username" placeholder="Username">

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">


<button onclick="signup()">
Sign Up
</button>


</section>






<section class="posts">


<div class="post">

<div class="username">
@chatgpt
</div>

<br>

<p>
Welcome to GooberNet 🎉🪿
</p>

</div>



<div class="post">

<div class="username">
@isaac
</div>

<br>

<p>
We're actually making a social media app 😭🙏
</p>

</div>



</section>






<footer>

© 2026 GooberNet • Certified Goobers Only 🪿

</footer>





<!-- ONLY SUPABASE SECTION -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const supabaseUrl =
"https://lamnpsupqyhvhebkyrsy.supabase.co";


const supabaseKey =
"YOUR_PUBLISHABLE_KEY_HERE";


const client =
window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);



console.log("Supabase connected!");





function goober(){

alert(
"Welcome, certified goober 😭🙏"
);

}





async function signup(){


const username =
document.getElementById("username").value;


const email =
document.getElementById("email").value;


const password =
document.getElementById("password").value;




const { data, error } =
await client.auth.signUp({

email: email,

password: password

});



if(error){

alert(error.message);

return;

}




await client
.from("profiles")
.insert({

id:data.user.id,

username:username

});



alert(
"Account created! Welcome to GooberNet 🪿🔥"
);



}



</script>


</body>

</html>
